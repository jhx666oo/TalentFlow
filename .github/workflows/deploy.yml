name: Deploy

on:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"
          LATEST_TAG="ghcr.io/${{ github.repository }}/backend:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" ./hr-backend/hr-backend
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: SSH 部署到阿里云 ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          script: |
            set -e

            cd /opt/talentflow

            # 拉取最新代码（含 docker-compose.yml 等）
            git pull origin main

            # 用新镜像更新 services 的 image 字段
            # 生成一个 docker-compose.override.yml，让 backend 使用新镜像而非本地构建
            cat > docker-compose.override.yml <<'COMPOSE'
services:
  backend:
    image: ghcr.io/${{ github.repository }}/backend:latest
    build: []
COMPOSE

            # 登录 ghcr.io
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取新镜像
            docker compose pull backend || true

            # 重建并重启
            docker compose up -d --remove-orphans

            # 清理旧镜像
            docker image prune -f
            docker logout ghcr.io

            echo "✅ 部署完成！"
