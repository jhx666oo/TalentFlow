name: Deploy

on:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"
          LATEST_TAG="ghcr.io/${{ github.repository }}/backend:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" ./hr-backend/hr-backend
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: SSH 部署到阿里云 ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          script: |
            set -e

            cd /opt/talentflow

            # 生成 override.yml，让 backend 使用 GHCR 上的预构建镜像
            cat > docker-compose.override.yml <<'COMPOSE'
services:
  backend:
    image: ghcr.io/${{ github.repository }}/backend:latest
    build: []
COMPOSE
            echo "✅ docker-compose.override.yml 已生成"

            # 登录 ghcr.io
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "✅ GHCR 登录成功"

            # 拉取最新镜像
            docker compose pull backend
            echo "✅ 镜像拉取完成"

            # 重启服务
            docker compose up -d --remove-orphans
            echo "✅ 容器已重启"

            # 清理
            docker image prune -f
            docker logout ghcr.io

            echo "✅ 部署完成！"
